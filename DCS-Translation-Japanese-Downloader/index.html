<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="refresh" content="15;url=https://dcs-translation-japanese.github.io/WebUI/">
  <meta name="description" content="DCS Translation Japaneseのダウンロードページは新しいURLへ移動しました。新しいページはこちらから開けます。">
  <title>ページが移動しました | DCS Translation Japanese</title>
  <link rel="canonical" href="https://dcs-translation-japanese.github.io/WebUI/">
  <link rel="icon" href="data:,">
  <style>
    :root { color-scheme: light dark; --bg: #f3f6f8; --text: #182c3c; --muted: #455c6e; --link: #075d9c; }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #121e28; --text: #edf3f8; --muted: #b0c3d2; --link: #8bcaff; }
    }
    * { box-sizing: border-box; }
    body { display: grid; place-items: center; min-height: 100vh; min-height: 100svh; margin: 0; background: var(--bg); color: var(--text); font-family: "Yu Gothic", "Hiragino Kaku Gothic ProN", Meiryo, sans-serif; line-height: 1.85; }
    main { display: grid; gap: 1.5rem; width: min(100%, 44rem); padding: 2rem 1.5rem; text-align: center; }
    p, h1 { margin: 0; }
    .site-name { color: var(--muted); font-weight: 700; }
    h1 { font-size: clamp(1.75rem, 5vw, 2.5rem); line-height: 1.45; text-wrap: balance; }
    h1 + .note { margin-top: -1rem; }
    a { color: var(--link); text-underline-offset: 0.2em; }
    a:focus-visible { outline: 3px solid var(--link); outline-offset: 5px; }
    .url { font-family: Consolas, "Liberation Mono", monospace; font-size: 0.9rem; overflow-wrap: anywhere; }
    .note { color: var(--muted); }
  </style>
</head>
<body>
  <main>
    <p class="site-name">DCS Translation Japanese</p>
    <h1>ページが移動しました</h1>
    <p class="note">ブックマークの更新をお願いします。</p>
    <p class="url"><a href="https://dcs-translation-japanese.github.io/WebUI/">https://dcs-translation-japanese.github.io/WebUI/</a></p>
    <p class="note">15秒後に新しいページへ自動的に移動します。</p>
  </main>
</body>
</html>

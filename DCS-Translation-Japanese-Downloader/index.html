<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="DCS日本語翻訳のダウンロードページは新しいURLへ移動しました。新しいページはこちらから開けます。">
  <title>ページが移動しました | DCS日本語翻訳</title>
  <link rel="canonical" href="https://dcs-translation-japanese.github.io/WebUI/">
  <link rel="icon" href="data:,">
  <style>
    :root { color-scheme: light dark; --bg: #f3f6f8; --text: #182c3c; --muted: #455c6e; --link: #075d9c; --button: #075d9c; --button-text: #ffffff; }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #121e28; --text: #edf3f8; --muted: #b0c3d2; --link: #8bcaff; --button: #8bcaff; --button-text: #12212d; }
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--text); font-family: "Yu Gothic", "Hiragino Kaku Gothic ProN", Meiryo, sans-serif; line-height: 1.85; }
    main { display: grid; gap: 1.5rem; width: min(100%, 44rem); margin: 12vh auto 0; padding: 2rem 1.5rem 4rem; }
    p, h1 { margin: 0; }
    .site-name { color: var(--muted); font-weight: 700; }
    h1 { font-size: clamp(1.75rem, 5vw, 2.5rem); line-height: 1.45; text-wrap: balance; }
    a { color: var(--link); text-underline-offset: 0.2em; }
    a:focus-visible { outline: 3px solid var(--link); outline-offset: 5px; }
    .action { justify-self: start; padding: 0.8rem 1.4rem; background: var(--button); color: var(--button-text); font-weight: 700; text-decoration: none; }
    .action:hover { text-decoration: underline; }
    .url { font-family: Consolas, "Liberation Mono", monospace; font-size: 0.9rem; overflow-wrap: anywhere; }
    .note { color: var(--muted); }
  </style>
</head>
<body>
  <main>
    <p class="site-name">DCS日本語翻訳</p>
    <h1>ページが移動しました</h1>
    <p>DCS日本語翻訳のダウンロードページは、以下のURLへ移動しました。</p>
    <a class="action" href="https://dcs-translation-japanese.github.io/WebUI/">新しいページを開く</a>
    <p class="url"><a href="https://dcs-translation-japanese.github.io/WebUI/">https://dcs-translation-japanese.github.io/WebUI/</a></p>
    <p class="note">ブックマークの更新をお願いします。</p>
  </main>
</body>
</html>
